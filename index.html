<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Информатика 5-сынып: Сәйкестендіру Ойыны</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #333;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-card {
      background: #ffffff;
      width: 100%;
      max-width: 1000px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      position: relative;
    }
    h1 {
      text-align: center;
      color: #1e3c72;
      margin-top: 0;
      font-size: 26px;
    }
    .instructions {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
      font-size: 15px;
    }
    .match-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }
    .item-card:hover {
      border-color: #007bff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .item-card.selected {
      background: #e3f2fd;
      border-color: #2196f3;
      box-shadow: 0 0 10px rgba(33, 150, 243, 0.5);
    }
    .item-card.matched {
      background: #d4edda !important;
      border-color: #28a745 !important;
      color: #155724;
      cursor: default;
      pointer-events: none;
      opacity: 0.85;
    }
    .target-badge {
      display: inline-block;
      background: #e9ecef;
      color: #495057;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .text-content {
      font-size: 14px;
      font-weight: 600;
    }
    .controls {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-text {
      font-size: 18px;
      font-weight: bold;
      color: #1e3c72;
    }
    .btn-reset {
      background: #ff4757;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-reset:hover {
      background: #ff6b81;
    }

    /* Анық Анимациялық Салют Эффектісі */
    .firework-particle {
      position: fixed;
      pointer-events: none;
      font-size: 32px;
      z-index: 10000;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
      animation: explode 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes explode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.3) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(180deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.2), calc(var(--dy) * 1.2 + 30px)) scale(0.8) rotate(360deg);
      }
    }
  </style>
</head>
<body>

<div class="game-card">
  <h1>🎮 Информатика 5-сынып: Сәйкестендіру Ойыны</h1>
  <div class="instructions">
    Сол жақтан ұғымды таңдап, оң жақтан оған сәйкес келетін анықтамасын табыңыз!
  </div>

  <div class="match-container">
    <div class="column" id="left-column"></div>
    <div class="column" id="right-column"></div>
  </div>

  <div class="controls">
    <div class="status-text" id="status">Табылған сәйкестіктер: 0 / 10</div>
    <button class="btn-reset" onclick="initGame()">Ойынды қайта бастау</button>
  </div>
</div>

<script>
// 10 Тапсырма мен Оқу мақсаттары дерекқоры
const gameData = [
  {
    id: 1,
    target: "5.4.1.1 Ергономика ережелерін сақтау",
    left: "Экранға дейінгі арақашықтық",
    right: "50 - 70 см болуы тиіс"
  },
  {
    id: 2,
    target: "5.2.1.1 Ақпарат түрлерін ажырату",
    left: "Фотосуреттер, суреттер, сызбалар",
    right: "Графикалық ақпарат"
  },
  {
    id: 3,
    target: "5.2.1.1 Компьютерде ақпараттың сақталуы",
    left: "Екілік кодтау цифрлары",
    right: "0 және 1"
  },
  {
    id: 4,
    target: "5.3.3.1 Іздеу сұраныстарын құру",
    left: "Нақты сөз тіркесін іздеу белгісі",
    right: "Тырнақша « » белгісі"
  },
  {
    id: 5,
    target: "5.3.3.1 Нақты ақпарат алу үшін іздеу",
    left: "Браузердегі Бетбелгілер (Bookmarks)",
    right: "Қажетті сайтты сақтап қою"
  },
  {
    id: 6,
    target: "5.1.1.1 Есептеу техникасының тарихы",
    left: "Ең алғашқы есептеу құралы",
    right: "Абак (шоттар)"
  },
  {
    id: 7,
    target: "5.1.1.1 Есептеу техникасының дамуы",
    left: "Алғашқы электронды машина (ЕЕМ)",
    right: "ENIAC компьютері"
  },
  {
    id: 8,
    target: "5.1.1.2 Программалық жасақтаманы жіктеу",
    left: "Операциялық жүйе (Windows, Linux)",
    right: "Жүйелік программалық жасақтама"
  },
  {
    id: 9,
    target: "5.1.1.2 Программалық жасақтаманы жіктеу",
    left: "Paint, MS Word, Браузерлер",
    right: "Қолданбалы программалық жасақтама"
  },
  {
    id: 10,
    target: "5.1.1.2 Жасанды интеллектіні қолдану",
    left: "Siri, Алиса, Дауыстық ассистенттер",
    right: "Жасанды интеллект мысалы"
  }
];

let selectedLeft = null;
let selectedRight = null;
let matchedCount = 0;

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function initGame() {
  selectedLeft = null;
  selectedRight = null;
  matchedCount = 0;
  document.getElementById('status').innerText = `Табылған сәйкестіктер: 0 / ${gameData.length}`;

  const leftCol = document.getElementById('left-column');
  const rightCol = document.getElementById('right-column');

  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  const shuffledLeft = shuffle([...gameData]);
  const shuffledRight = shuffle([...gameData]);

  shuffledLeft.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.dataset.id = item.id;
    card.onclick = (e) => selectLeft(card, e);
    card.innerHTML = `
      <div class="target-badge">${item.target}</div>
      <div class="text-content">${item.left}</div>
    `;
    leftCol.appendChild(card);
  });

  shuffledRight.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.dataset.id = item.id;
    card.onclick = (e) => selectRight(card, e);
    card.innerHTML = `
      <div class="text-content">${item.right}</div>
    `;
    rightCol.appendChild(card);
  });
}

function selectLeft(card, event) {
  if (card.classList.contains('matched')) return;
  
  document.querySelectorAll('#left-column .item-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedLeft = card;

  checkMatch(event);
}

function selectRight(card, event) {
  if (card.classList.contains('matched')) return;

  document.querySelectorAll('#right-column .item-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedRight = card;

  checkMatch(event);
}

function checkMatch(event) {
  if (selectedLeft && selectedRight) {
    const leftId = selectedLeft.dataset.id;
    const rightId = selectedRight.dataset.id;

    if (leftId === rightId) {
      // Дұрыс сәйкестік
      selectedLeft.classList.add('matched');
      selectedRight.classList.add('matched');
      
      selectedLeft.classList.remove('selected');
      selectedRight.classList.remove('selected');

      matchedCount++;
      document.getElementById('status').innerText = `Табылған сәйкестіктер: ${matchedCount} / ${gameData.length}`;

      // Анық салют шашылуы
      triggerComputerFireworks(event.clientX, event.clientY);

      if (matchedCount === gameData.length) {
        setTimeout(() => {
          alert('Жарайсың! Барлық сұрақтарды дұрыс сәйкестендірдіңіз! 🎉');
          // Жеңіс салюты
          for(let i = 0; i < 6; i++) {
            setTimeout(() => {
              triggerComputerFireworks(
                Math.random() * (window.innerWidth - 100) + 50,
                Math.random() * (window.innerHeight - 100) + 50
              );
            }, i * 200);
          }
        }, 300);
      }
    } else {
      // Қате болса белгілеуді алып тастау
      setTimeout(() => {
        if (selectedLeft) selectedLeft.classList.remove('selected');
        if (selectedRight) selectedRight.classList.remove('selected');
        selectedLeft = null;
        selectedRight = null;
      }, 400);
      return;
    }

    selectedLeft = null;
    selectedRight = null;
  }
}

// Компьютер құрылғыларының жарқыраған Салют Анимациясы
function triggerComputerFireworks(x, y) {
  const compIcons = ['🖥️', '💻', '⌨️', '🖱️', '🖨️', '🛜', '⚙️', '💾', '🔌'];
  const particleCount = 14;

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'firework-particle';
    particle.innerText = compIcons[Math.floor(Math.random() * compIcons.length)];

    particle.style.left = x + 'px';
    particle.style.top = y + 'px';

    const angle = (Math.PI * 2 * i) / particleCount;
    const velocity = 90 + Math.random() * 80;
    
    const dx = Math.cos(angle) * velocity + 'px';
    const dy = Math.sin(angle) * velocity + 'px';

    particle.style.setProperty('--dx', dx);
    particle.style.setProperty('--dy', dy);

    document.body.appendChild(particle);

    setTimeout(() => {
      particle.remove();
    }, 1000);
  }
}

// Ойынды бастау
initGame();
</script>

</body>
</html>
